<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vetcontrol</title>

    <link rel="shortcut icon" href="../img/pata-de-cachorro (1).png" type="image/x-icon">

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/inicial.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    

    <main>
        <section>

            <div class="inicio">
                <img src="../img/icone-coração-branco.png" alt="icone-logo-do-site" />
                <h1>Controle Veterinário</h1>
            </div>

        <div class="tela1">
            <div class="divLogin">
                <h1 class="titulo">Bem-vindo de volta!</h1>
                <p>Acesse sua conta e continue gerenciando a saúde e bem-estar dos pets com <br> eficiência e cuidado.</p>
                <div class="imgLogin"><img src="" alt="imagem-tela-login"></div>
            </div>
            <div class="divLogin">
                <form action="" class="loginForm">
                    <h2>Entrar</h2>
                    <p>Acesse sua conta para continuar</p>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="*********" required>

                    <div>
                        <input type="checkbox" id="lembrar">
                        <label for="lembrar">Lembrar-me</label>
                        <button type="submit" onclick="">Entrar →</button>
                    </div>

                    <p class="cadastro">Não tem uma conta?</p>
                    <a href="cadastro.html" class="btnCadastro">Criar conta</a>
                </form>

                <a href="" class="btn-mudar">← Voltar para o início</a>
            </div>
        </div>
        </section>
    </main>
</body>
</html>
