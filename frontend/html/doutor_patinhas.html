<div class="chat-toggle" id="chatToggle" aria-label="Abrir chatbot">
  <span>🐾</span>
</div>
<link rel="stylesheet" href="../css/chat.css">
<div class="chatbot" id="chatbot">
  <div class="chatbot-header">
    <div class="chatbot-title">
      <span class="chatbot-emoji">🐶</span>
      <div>
        <h3>Doutor Patinhas</h3>
        <p>Assistente oficial do VetControl</p>
      </div>
    </div>

    <button class="chat-close" id="chatClose" aria-label="Fechar chatbot">✕</button>
  </div>

  <div class="chatbot-body" id="chatBody">
    <div class="bot-message">
      Olá, humano! Eu sou o <strong>Doutor Patinhas</strong> 🐾<br>
      Escolha uma opção abaixo e eu te conto tudo com muito estilo veterinário.
    </div>
  </div>

  <div class="chatbot-actions">
    <button class="chat-btn" data-resposta="perguntas">Perguntas rápidas</button>
    <button class="chat-btn" data-resposta="equipe">Equipe</button>
    <button class="chat-btn" data-resposta="bastidores">Bastidores</button>
  </div>

  <div class="chatbot-quick">
    <button class="quick-btn" data-direto="o que é o vetcontrol">O que é o sistema?</button>
    <button class="quick-btn" data-direto="como funciona">Como funciona?</button>
    <button class="quick-btn" data-direto="quem fez o projeto">Quem fez o projeto?</button>
    <button class="quick-btn" data-direto="fale da equipe">Fale da equipe</button>
    <button class="quick-btn" data-direto="fale da escola">Sobre a escola</button>
    <button class="quick-btn" data-direto="qual o diferencial">Qual o diferencial?</button>
  </div>
</div>
<script src="../html/chat.js"></script>
